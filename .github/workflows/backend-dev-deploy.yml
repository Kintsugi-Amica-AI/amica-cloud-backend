name: Backend Dev Deploy

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

# One deploy at a time: overlapping runs make Cloud Functions answer
# "409 unable to queue the operation" for functions both runs update.
concurrency:
  group: backend-dev-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Firebase config files
        run: |
          test -f firestore.rules
          test -f firestore.indexes.json
          test -f firebase.json

      - name: Validate vehicle seed JSON
        run: |
          if [ -f seed-data/vehicles.json ]; then
            python -m json.tool seed-data/vehicles.json > /tmp/vehicles.json
          else
            echo "seed-data/vehicles.json not found"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install function dependencies
        run: |
          if [ -f functions/package.json ]; then
            cd functions
            npm install
          else
            echo "No functions/package.json found. Skipping npm install."
          fi

      - name: Run function tests
        run: |
          if [ -f functions/package.json ]; then
            cd functions
            npm test --if-present
          else
            echo "No functions/package.json found. Skipping tests."
          fi

  deploy-dev:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Firebase credentials file
        env:
          FIREBASE_SERVICE_ACCOUNT_DEV: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_DEV" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_DEV secret is not configured"
            exit 1
          fi
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_DEV" > "$HOME/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Check Firebase project variable
        env:
          FIREBASE_PROJECT_ID_DEV: ${{ vars.FIREBASE_PROJECT_ID_DEV }}
        run: |
          if [ -z "$FIREBASE_PROJECT_ID_DEV" ]; then
            echo "::error::FIREBASE_PROJECT_ID_DEV variable is not configured"
            exit 1
          fi
          echo "FIREBASE_PROJECT_ID_DEV=$FIREBASE_PROJECT_ID_DEV" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install function dependencies
        run: |
          if [ -f functions/package.json ]; then
            cd functions
            npm install
          else
            echo "No functions/package.json found. Skipping npm install."
          fi

      - name: Build functions
        run: |
          if [ -f functions/package.json ]; then
            cd functions
            npm run build --if-present
          else
            echo "No functions/package.json found. Skipping functions build."
          fi

      - name: Deploy Firestore rules and indexes to dev
        run: |
          firebase deploy --only firestore:rules,firestore:indexes --project "$FIREBASE_PROJECT_ID_DEV" --non-interactive

      # Separate step so a Storage problem never blocks the Firestore rules.
      # Needs the default bucket to exist (Console > Storage > Get started) and
      # the CI service account to have "Firebase Storage Admin"
      # (roles/firebasestorage.admin); see docs/scan_vehicle_setup.md.
      - name: Deploy Storage rules to dev
        run: |
          firebase deploy --only storage --project "$FIREBASE_PROJECT_ID_DEV" --non-interactive

      # Website contact form: the Gmail App Password reaches the function as an
      # environment parameter (functions/.env.<project>, never committed), so
      # the CI service account needs no Secret Manager roles. Without the
      # GitHub secret, messages are still stored but not emailed.
      - name: Write contact-form email settings
        env:
          CONTACT_SMTP_APP_PASSWORD: ${{ secrets.CONTACT_SMTP_APP_PASSWORD }}
        run: |
          if [ -z "$CONTACT_SMTP_APP_PASSWORD" ]; then
            echo "::warning::CONTACT_SMTP_APP_PASSWORD secret is not set; contact messages will be stored but not emailed"
            exit 0
          fi
          umask 077
          printf 'CONTACT_SMTP_APP_PASSWORD="%s"\n' "${CONTACT_SMTP_APP_PASSWORD// /}" >> "functions/.env.$FIREBASE_PROJECT_ID_DEV"

      - name: Deploy functions to dev if configured
        run: |
          if [ -f functions/package.json ]; then
            firebase deploy --only functions --project "$FIREBASE_PROJECT_ID_DEV" --non-interactive --force
          else
            echo "No functions configured. Skipping functions deploy."
          fi

      - name: Deploy Hosting (watch-live page) to dev
        run: |
          # /j/<token> links sent to her circle are served from Hosting, and
          # /api/live is rewritten to the liveJourney function deployed above.
          firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID_DEV" --non-interactive
