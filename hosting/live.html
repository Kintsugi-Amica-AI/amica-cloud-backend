<style>

  * { box-sizing: border-box; }

  .top { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center;
    justify-content: space-between; gap: 12px;
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px; pointer-events: none; }

  .row { display: flex; gap: 10px; margin-top: 14px; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .fact { background: var(--shell); border-radius: 14px; padding: 10px 12px; min-width: 0; }
  .fact b { display: block; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    font: 600 15px "Public Sans", sans-serif; text-decoration: none; border: 1.5px solid var(--line); color: var(--ink); background: var(--card); }
  .btn.primary { border: 0; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-end)); }
  .btn.danger { border: 0; color: #fff; background: var(--danger); }
  .banner { border-radius: 14px; padding: 11px 13px; margin-top: 12px; font-weight: 500; font-size: 14px; }
  .banner.sos { background: var(--danger-soft); color: var(--danger-ink); }
  .banner.stale { background: var(--warn-soft); color: var(--warn); }
  .center { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: var(--ground); text-align: center; }
  .center .card { box-shadow: none; background: transparent; }
  .badge { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center;
    font-size: 30px; background: var(--accent-soft); color: var(--accent-ink); }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }

  .me { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); border: 3px solid #fff;
    box-shadow: 0 0 0 0 rgba(124,77,235,.5); animation: me 2s ease-out infinite; }
  .me.sos { background: var(--danger); }

<body>
<div id="map" aria-label="Map"></div>

<div class="top">
  <span class="brand"><i></i>Amica</span>
  <span id="pill" class="pill hidden"><span class="dot"></span><span id="pillText"></span></span>
</div>

<div class="sheet hidden" id="sheet">
  <div class="card">
    <div class="muted small" id="kicker"></div>
    <h1 id="title"></h1>
    <div id="sosBanner" class="banner sos hidden"></div>
    <div id="staleBanner" class="banner stale hidden"></div>
    <div class="facts">
      <div class="fact"><span data-t="expected"></span><b id="eta">—</b></div>
      <div class="fact"><span data-t="lastUpdate"></span><b id="updated">—</b></div>
    </div>
    <div class="row">
      <a id="mapsBtn" class="btn primary" target="_blank" rel="noopener" data-t="openMaps"></a>
      <a id="callBtn" class="btn danger hidden" href="tel:119" data-t="call119"></a>
    </div>
    <p class="muted small" style="margin:12px 2px 0" data-t="footer"></p>
  </div>
</div>

<div class="center" id="state">
  <div class="card">
    <div class="badge" id="stateBadge">•</div>
    <h2 id="stateTitle" data-t="loading" style="margin:0 0 6px"></h2>
    <p class="muted" id="stateBody"></p>

</div>

  }
  function clock(iso) {
    if (!iso) return "—";
    try { return new Date(iso).toLocaleTimeString(lang, { hour: "numeric", minute: "2-digit" }); }
    catch (e) { return new Date(iso).toLocaleTimeString(); }
  }

  // Google encoded polyline → [[lat, lng], …]
  function decode(str) {
    var points = [], index = 0, lat = 0, lng = 0;
    while (index < str.length) {
      var b, shift = 0, result = 0;
      do { b = str.charCodeAt(index++) - 63; result |= (b & 31) << shift; shift += 5; } while (b >= 32);
      lat += (result & 1) ? ~(result >> 1) : (result >> 1);
      shift = 0; result = 0;
      do { b = str.charCodeAt(index++) - 63; result |= (b & 31) << shift; shift += 5; } while (b >= 32);
      lng += (result & 1) ? ~(result >> 1) : (result >> 1);
      points.push([lat / 1e5, lng / 1e5]);
    }
    return points;
  }

  function ensureMap() {
    if (map || !window.L) return;
    map = L.map("map", { zoomControl: false, attributionControl: true });
    L.control.zoom({ position: "topright" }).addTo(map);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);
  }

  function stateScreen(badge, title, body, ok) {
    show($("state"), true); show($("sheet"), false); show($("pill"), false);
    $("stateBadge").textContent = badge;
    $("stateBadge").classList.toggle("ok", !!ok);
    $("stateTitle").textContent = title;
    $("stateBody").textContent = body || "";
  }

  function render(d) {
    var name = d.ownerName || t("someone");
    if (d.status === "ended") {
      var arrived = d.endReason === "safe";
      stateScreen(arrived ? "✓" : "•",
        t(arrived ? "arrivedTitle" : "endedTitle", { name: name }),
        t(arrived && d.destinationName ? "arrivedBody" : "endedBody",
          { name: name, dest: d.destinationName, when: ago(d.endedAt) }),
        arrived);
      stop();
      return;
    }

    show($("state"), false); show($("sheet"), true); show($("pill"), true);
    var sos = d.status === "sos";
    var updatedAt = d.location && d.location.updatedAt;
    var stale = !sos && updatedAt && (Date.now() + clockSkew - Date.parse(updatedAt)) > STALE_MS;

    var pill = $("pill");
    pill.className = "pill " + (sos ? "sos" : stale ? "stale" : "live");
    $("pillText").textContent = sos ? t("sos") : stale ? t("stale") : t("live");

    $("kicker").textContent = t("kicker");
    $("title").textContent = d.destinationName
      ? t("heading", { name: name, dest: d.destinationName })
      : t("headingNoDest", { name: name });
    show($("sosBanner"), sos);
    $("sosBanner").textContent = t("sosBanner", { name: name });
    show($("callBtn"), sos);
    show($("staleBanner"), !!stale);
    $("staleBanner").textContent = t("staleBanner", { ago: ago(updatedAt) });
    $("eta").textContent = clock(d.estimatedEndTime);
    $("updated").textContent = ago(updatedAt);

    var loc = d.location;
    var mapsBtn = $("mapsBtn");
    if (loc) {
      mapsBtn.href = "https://www.google.com/maps/search/?api=1&query=" + loc.latitude + "," + loc.longitude;
      show(mapsBtn, true);
    } else {
      show(mapsBtn, false);
    }

    ensureMap();
    if (!map) return;
    if (d.routePolyline && !routeLine) {
      try {
        routeLine = L.polyline(decode(d.routePolyline), { color: "#7C4DEB", weight: 5, opacity: .75 }).addTo(map);
      } catch (e) { /* a bad polyline only costs the route line */ }
    }
    if (d.destination && !destMarker) {
      destMarker = L.marker([d.destination.latitude, d.destination.longitude], {
        icon: L.divIcon({ className: "", html: '<div class="flag"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }),
        title: t("dest"), keyboard: false
      }).addTo(map);
    }
    if (loc) {
      var ll = [loc.latitude, loc.longitude];
      var icon = L.divIcon({ className: "", html: '<div class="me' + (sos ? " sos" : "") + '"></div>', iconSize: [20, 20], iconAnchor: [10, 10] });
      if (!meMarker) {
        meMarker = L.marker(ll, { icon: icon, title: t("you"), keyboard: false, zIndexOffset: 1000 }).addTo(map);
      } else {
        meMarker.setLatLng(ll); meMarker.setIcon(icon);
      }
    }
    if (!framed && (loc || d.destination)) {
      framed = true;
      var pts = [];
      if (loc) pts.push([loc.latitude, loc.longitude]);
      if (d.destination) pts.push([d.destination.latitude, d.destination.longitude]);
      var sheetH = $("sheet").offsetHeight || 260;
      if (pts.length === 1) map.setView(pts[0], 16);
      else map.fitBounds(pts, { paddingTopLeft: [40, 90], paddingBottomRight: [40, sheetH + 30], maxZoom: 16 });
    } else if (loc && map.getBounds && !map.getBounds().pad(-0.15).contains([loc.latitude, loc.longitude])) {
      map.panTo([loc.latitude, loc.longitude]);
    }
  }

  function stop() { if (timer) { clearTimeout(timer); timer = null; } }
  function schedule() {
    stop();
    var base = document.hidden ? 30000 : (last && last.status === "sos" ? 4000 : 6000);
    timer = setTimeout(poll, Math.min(base * Math.pow(2, Math.min(failures, 3)), 60000));
  }

  function poll() {
    if (!/^[A-Za-z0-9_-]{20,64}$/.test(token)) {
      stateScreen("?", t("notFoundTitle"), t("notFoundBody"));
      return;
    }
    fetch("/api/live?token=" + encodeURIComponent(token), { cache: "no-store" })
      .then(function (res) {
        if (res.status === 404) { stateScreen("?", t("notFoundTitle"), t("notFoundBody")); stop(); return null; }
        if (res.status === 410) { stateScreen("⌛", t("expiredTitle"), t("expiredBody")); stop(); return null; }
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (d) {
        if (!d) return;
        failures = 0;
        if (d.serverTime) clockSkew = Date.parse(d.serverTime) - Date.now();
        last = d;
        render(d);
        if (d.status !== "ended") schedule();
      })
      .catch(function () {
        failures++;
        if (!last) stateScreen("…", t("offlineTitle"), t("offlineBody"));
        schedule();
      });
  }

  // Keep "12s ago" honest between polls.
  setInterval(function () { if (last && last.status !== "ended") render(last); }, 5000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden && last && last.status !== "ended") poll(); });
  poll();
})();
</script>
</body>
</html>
